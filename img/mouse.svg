<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="20" fill="#F0F4F8"/>
  <!-- Mouse body -->
  <rect x="38" y="25" width="44" height="70" rx="22" fill="#1B365D"/>
  <!-- Click separator -->
  <line x1="60" y1="26" x2="60" y2="52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Scroll wheel -->
  <rect x="56" y="35" width="8" height="14" rx="4" fill="#5568FE"/>
  <!-- Accent light curve -->
  <path d="M 45 75 Q 60 85 75 75" fill="none" stroke="#5568FE" stroke-width="3" stroke-linecap="round"/>
</svg>
